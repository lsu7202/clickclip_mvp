services:
  ai_server:
    build: ./ai_server
    env_file: ./ai_server/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # 컨테이너 간 통신은 compose 네트워크 이름으로
      AI_SERVER_URL: "http://ai_server:8000"
      WORKSPACE_DIR: "/workspace"
      CAPCUT_TEMPLATE_DIR: "/templates/0615"
    ports:
      - "4000:4000"
    volumes:
      - workspace:/workspace
      - ./templates/0615:/templates/0615:ro
    depends_on:
      - ai_server
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  workspace:
